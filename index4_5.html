<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бизнес-Ланчи Москва - Собрать ланч</title>
    <link rel="stylesheet" href="styless4_5.css">
    <link rel="stylesheet" href="styless.css">
    <style>
        
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding-left: 20px;
        }
        .filters button {
            padding: 8px 16px;
            border: 1px solid tomato;
            background: #fff;
            color: tomato;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .filters button:hover {
            background: rgba(255, 99, 71, 0.1);
        }
        .filters button.active {
            background: tomato;
            color: white;
        }
        .dishes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            padding: 20px;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <h1>Бизнес-Ланчи Москва</h1>
        <nav>
            <a href="Lr-1.html">Главная</a>
            <a href="#" class="active">Собрать ланч</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </header>

    <main>
        <section data-category="soup">
            <h2>Супы</h2>
            <div class="filters">
                <button data-kind="fish">Рыбный</button>
                <button data-kind="meat">Мясной</button>
                <button data-kind="veg">Вегетарианский</button>
            </div>
            <div class="dishes"></div>
        </section>

        <section data-category="main">
            <h2>Главные блюда</h2>
            <div class="filters">
                <button data-kind="fish">Рыбное</button>
                <button data-kind="meat">Мясное</button>
                <button data-kind="veg">Вегетарианское</button>
            </div>
            <div class="dishes"></div>
        </section>

        <section data-category="salad">
            <h2>Салаты и стартеры</h2>
            <div class="filters">
                <button data-kind="fish">Рыбный</button>
                <button data-kind="meat">Мясной</button>
                <button data-kind="veg">Вегетарианский</button>
            </div>
            <div class="dishes"></div>
        </section>
        
        <section data-category="drink">
            <h2>Напитки</h2>
            <div class="filters">
                <button data-kind="cold">Холодный</button>
                <button data-kind="hot">Горячий</button>
            </div>
            <div class="dishes"></div>
        </section>

        <section data-category="dessert">
            <h2>Десерты</h2>
            <div class="filters">
                <button data-kind="small">Маленькая порция</button>
                <button data-kind="medium">Средняя порция</button>
                <button data-kind="large">Большая порция</button>
            </div>
            <div class="dishes"></div>
        </section>

        <!-- ЗАКАЗ -->
        <section class="order-section">
            <h2>Сделать заказ</h2>
            <form class="order-form">
                <fieldset class="form-column">
                    <legend>Ваш заказ</legend>
                    <div id="nothing-selected">Ничего не выбрано</div>
                    
                    <div id="order-items" class="hidden" style="display: flex; flex-direction: column; gap: 10px;">
                        <div id="selected-soup"><strong>Суп:</strong> <span>Не выбрано</span></div>
                        <div id="selected-main"><strong>Главное:</strong> <span>Не выбрано</span></div>
                        <div id="selected-salad"><strong>Салат:</strong> <span>Не выбрано</span></div>
                        <div id="selected-drink"><strong>Напиток:</strong> <span>Не выбрано</span></div>
                        <div id="selected-dessert"><strong>Десерт:</strong> <span>Не выбрано</span></div>
                    </div>

                    <div id="total-cost" class="hidden" style="margin-top:20px; font-weight:bold;">
                        Итого: <span id="total-sum">0</span>₽
                    </div>
                </fieldset>

                <fieldset class="form-column">
    <legend>Ваши данные</legend>
    
    <div class="form-group">
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" required placeholder="Иван">
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="ivan@example.com">
    </div>

    <div class="form-group">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" required placeholder="+7 (999) 000-00-00">
    </div>

    <div class="form-group">
        <label for="address">Адрес доставки</label>
        <input type="text" id="address" name="address" required placeholder="Улица, дом, квартира">
    </div>

    <div class="form-group">
        <label>Время доставки</label>
        <div class="radio-group" style="margin-top: 5px;">
            <label style="display:inline-flex; align-items:center; gap:5px; margin-right:15px;">
                <input type="radio" name="delivery_type" value="asap" checked onchange="document.getElementById('time-input-block').style.display='none'"> 
                Как можно скорее
            </label>
            <label style="display:inline-flex; align-items:center; gap:5px;">
                <input type="radio" name="delivery_type" value="time" onchange="document.getElementById('time-input-block').style.display='block'"> 
                К определенному времени
            </label>
        </div>
    </div>

    <div class="form-group" id="time-input-block" style="display: none;">
        <label for="delivery_time">Укажите время</label>
        <input type="time" id="delivery_time" name="delivery_time" min="09:00" max="23:00">
    </div>

    <div class="form-group">
        <label for="comments">Комментарий к заказу</label>
        <textarea id="comments" name="comments" rows="3" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;" placeholder="Код домофона, этаж..."></textarea>
    </div>

    <button type="submit" class="btn-submit">Оформить</button>
</fieldset>

            </form>
        </section>
    </main>

    <footer id="contacts">
    </footer>

    <script src="4_5.js"></script>
    <script src="index.js"></script>
</body>
</html>
