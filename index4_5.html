<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бизнес-Ланчи Москва - Собрать ланч</title>
    <link rel="stylesheet" href="styless4_5.css">
    <style>
        /* Доп. стили только для Лаб 5 (фильтры) */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding-left: 20px; /* Чтобы было ровно */
        }
        .filters button {
            padding: 8px 16px;
            border: 1px solid tomato;
            background: #fff;
            color: tomato;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .filters button:hover {
            background: rgba(255, 99, 71, 0.1);
        }
        .filters button.active {
            background: tomato;
            color: white;
        }
        .dishes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            padding: 20px;
        }
        /* Скрываем секции если пустые (опционально) */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <h1>Бизнес-Ланчи Москва</h1>
        <nav>
            <a href="Lr-1.html">Главная</a>
            <a href="#" class="active">Собрать ланч</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </header>

    <main>
        <section data-category="soup">
            <h2>Супы</h2>
            <div class="filters">
                <button data-kind="fish">Рыбный</button>
                <button data-kind="meat">Мясной</button>
                <button data-kind="veg">Вегетарианский</button>
            </div>
            <div class="dishes"></div>
        </section>

        <section data-category="main">
            <h2>Главные блюда</h2>
            <div class="filters">
                <button data-kind="fish">Рыбное</button>
                <button data-kind="meat">Мясное</button>
                <button data-kind="veg">Вегетарианское</button>
            </div>
            <div class="dishes"></div>
        </section>

        <section data-category="salad">
            <h2>Салаты и стартеры</h2>
            <div class="filters">
                <button data-kind="fish">Рыбный</button>
                <button data-kind="meat">Мясной</button>
                <button data-kind="veg">Вегетарианский</button>
            </div>
            <div class="dishes"></div>
        </section>
        
        <section data-category="drink">
            <h2>Напитки</h2>
            <div class="filters">
                <button data-kind="cold">Холодный</button>
                <button data-kind="hot">Горячий</button>
            </div>
            <div class="dishes"></div>
        </section>

        <section data-category="dessert">
            <h2>Десерты</h2>
            <div class="filters">
                <button data-kind="small">Маленькая порция</button>
                <button data-kind="medium">Средняя порция</button>
                <button data-kind="large">Большая порция</button>
            </div>
            <div class="dishes"></div>
        </section>

        <!-- ЗАКАЗ -->
        <section class="order-section">
            <h2>Сделать заказ</h2>
            <form class="order-form">
                <fieldset class="form-column">
                    <legend>Ваш заказ</legend>
                    <div id="nothing-selected">Ничего не выбрано</div>
                    
                    <div id="order-items" class="hidden" style="display: flex; flex-direction: column; gap: 10px;">
                        <div id="selected-soup"><strong>Суп:</strong> <span>Не выбрано</span></div>
                        <div id="selected-main"><strong>Главное:</strong> <span>Не выбрано</span></div>
                        <div id="selected-salad"><strong>Салат:</strong> <span>Не выбрано</span></div>
                        <div id="selected-drink"><strong>Напиток:</strong> <span>Не выбрано</span></div>
                        <div id="selected-dessert"><strong>Десерт:</strong> <span>Не выбрано</span></div>
                    </div>

                    <div id="total-cost" class="hidden" style="margin-top:20px; font-weight:bold;">
                        Итого: <span id="total-sum">0</span>₽
                    </div>
                </fieldset>

                <fieldset class="form-column">
                    <legend>Ваши данные</legend>
                    <div class="form-group"><label>Имя</label><input type="text" name="name"></div>
                    <div class="form-group"><label>Email</label><input type="email" name="email"></div>
                    <button type="submit" class="btn-submit">Оформить</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer id="contacts">
    </footer>

    <script src="4_5.js"></script>
    <script src="app.js"></script>
</body>
</html>
