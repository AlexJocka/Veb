<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История заказов</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Доп стили для таблицы заказов */
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 40px;
        }
        .orders-table th, .orders-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .orders-table th {
            background: tomato;
            color: white;
            font-weight: bold;
        }
        .action-btn {
            cursor: pointer;
            margin-right: 5px;
            border: none;
            background: none;
            font-size: 1.2rem;
        }
        
        /* Модальные окна (простые, кастомные) */
        .modal {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); 
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        
        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }
        .modal-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-secondary {
            background: #ccc;
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <h1>Мои заказы</h1>
        <nav style="margin-top: 10px;">
            <a href="index7_8.html">⬅ Назад к меню</a>
        </nav>
    </header>

    <main>
        <h2 class="combo-section-title">История заказов</h2>
        
        <div style="overflow-x: auto;">
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Дата</th>
                        <th>Состав</th>
                        <th>Цена</th>
                        <th>Доставка</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <!-- Сюда JS вставит строки -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- МОДАЛКА: ПРОСМОТР -->
    <div id="modal-view" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('modal-view')">&times;</span>
            <h2>Детали заказа</h2>
            <div id="view-content"></div>
            <div class="modal-buttons">
                <button class="notification-btn" onclick="closeModal('modal-view')">ОК</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА: УДАЛЕНИЕ -->
    <div id="modal-delete" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('modal-delete')">&times;</span>
            <h2>Удаление заказа</h2>
            <p>Вы уверены, что хотите удалить этот заказ?</p>
            <div class="modal-buttons">
                <button class="notification-btn btn-secondary" onclick="closeModal('modal-delete')">Отмена</button>
                <button class="notification-btn" style="background: crimson;" id="confirm-delete-btn">Да, удалить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА: РЕДАКТИРОВАНИЕ -->
    <div id="modal-edit" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('modal-edit')">&times;</span>
            <h2>Редактирование</h2>
            <form id="edit-form">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" name="full_name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Адрес</label>
                    <input type="text" name="delivery_address" required>
                </div>
                <div class="form-group">
                    <label>Комментарий</label>
                    <textarea name="comment" rows="2"></textarea>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="notification-btn btn-secondary" onclick="closeModal('modal-edit')">Отмена</button>
                    <button type="submit" class="notification-btn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="orders.js"></script>
</body>
</html>
